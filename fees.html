<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Cricket Academy — Fee Management" />
  <title>Fees — Cricket Academy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="auth-loading-overlay" role="status">
  <div class="spinner-border"></div>
  <p>Loading…</p>
</div>

<div class="layout-wrapper">
  <aside id="sidebar" role="navigation" aria-label="Sidebar"></aside>
  <div id="sidebar-overlay"></div>

  <div class="main-content">
    <header class="top-navbar">
      <button id="sidebar-toggle" aria-label="Toggle sidebar"><i class="bi bi-list"></i></button>
      <span class="page-title"><i class="bi bi-cash-coin me-2"></i>Fee Management</span>
      <div class="ms-auto d-flex align-items-center gap-2">
        <button class="icon-btn" id="theme-toggle-btn" aria-label="Toggle theme"><i class="bi bi-moon-stars-fill" id="theme-icon"></i></button>
        <a href="#" class="btn btn-sm btn-outline-danger ms-1" data-action="logout" style="font-size:0.8rem;"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
      </div>
    </header>

    <main class="page-content" id="page-content" style="display:none;">
      <div class="page-header">
        <div>
          <h2><i class="bi bi-cash-coin me-2 text-primary-custom"></i>Fee Management</h2>
          <p>Track payments and pending fees</p>
        </div>
        <div class="d-flex gap-2 flex-wrap">
          <button class="btn btn-sm btn-outline-success" id="export-fees-excel" title="Export to Excel">
            <i class="bi bi-file-earmark-excel me-1"></i>Excel
          </button>
          <button class="btn btn-sm btn-outline-danger" id="export-fees-pdf" title="Export to PDF">
            <i class="bi bi-file-earmark-pdf me-1"></i>PDF
          </button>
          <button class="btn-primary-custom" id="add-fee-btn">
            <i class="bi bi-plus-circle-fill me-1"></i> Add Payment
          </button>
        </div>
      </div>

      <!-- Summary Cards -->
      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
          <div class="fee-summary-card card-panel card-primary" style="background:linear-gradient(135deg,var(--clr-primary),var(--clr-primary-light));">
            <div class="fee-icon" style="background:rgba(255,255,255,0.15);color:white;"><i class="bi bi-cash-stack"></i></div>
            <div>
              <div class="fee-amt" style="color:white;" id="fee-total-collected">₹0</div>
              <div class="fee-lbl" style="color:rgba(255,255,255,0.7);">Total Collected</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="fee-summary-card card-panel">
            <div class="fee-icon" style="background:rgba(158,42,43,0.1);color:var(--clr-danger-light);"><i class="bi bi-exclamation-circle-fill"></i></div>
            <div>
              <div class="fee-amt" id="fee-total-pending" style="color:var(--clr-danger-light);">₹0</div>
              <div class="fee-lbl" style="color:var(--clr-text-muted);">Total Pending</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="fee-summary-card card-panel">
            <div class="fee-icon" style="background:rgba(27,67,50,0.1);color:var(--clr-success-light);"><i class="bi bi-check-circle-fill"></i></div>
            <div>
              <div class="fee-amt" id="fee-paid-count" style="color:var(--clr-success-light);">0</div>
              <div class="fee-lbl" style="color:var(--clr-text-muted);">Paid Players</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="fee-summary-card card-panel">
            <div class="fee-icon" style="background:rgba(230,126,34,0.1);color:var(--clr-warning);"><i class="bi bi-hourglass-split"></i></div>
            <div>
              <div class="fee-amt" id="fee-pending-count" style="color:var(--clr-warning);">0</div>
              <div class="fee-lbl" style="color:var(--clr-text-muted);">Pending Players</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Filter + Table -->
      <div class="card-panel">
        <div class="panel-header">
          <h5><i class="bi bi-table me-1 text-primary-custom"></i>Payment Records</h5>
          <div class="d-flex gap-2 flex-wrap align-items-center">
            <div class="search-bar">
              <i class="bi bi-search"></i>
              <input type="search" id="fee-search" class="form-control form-control-sm" placeholder="Search player…" style="width:160px;" aria-label="Search fees" />
            </div>
            <select id="fee-filter-status" class="form-select form-select-sm" style="width:140px;" aria-label="Filter by status">
              <option value="">All Status</option>
              <option value="paid">Paid</option>
              <option value="pending">Pending</option>
              <option value="partial">Partial</option>
            </select>
            <select id="fee-filter-method" class="form-select form-select-sm" style="width:140px;" aria-label="Filter by payment method">
              <option value="">All Methods</option>
              <option value="cash">Cash</option>
              <option value="online">Online</option>
            </select>
            <button class="btn btn-sm btn-outline-secondary" id="clear-fee-filters" title="Clear filters">
              <i class="bi bi-x-circle"></i>
            </button>
          </div>
        </div>
        <div class="table-wrapper">
          <table class="data-table" id="fees-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Player Name</th>
                <th>Amount</th>
                <th>Payment Date</th>
                <th>Method</th>
                <th>Status</th>
                <th>Notes</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="fees-tbody">
              <tr>
                <td colspan="8">
                  <div class="table-loading">
                    <div class="spinner-border spinner-border-sm me-2"></div> Loading payments…
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Add/Edit Fee Modal -->
<div class="modal fade" id="feeModal" tabindex="-1" aria-labelledby="feeModalLabel" aria-modal="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="feeModalLabel"><i class="bi bi-plus-circle-fill me-2"></i>Add Payment</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="fee-form" novalidate>
          <input type="hidden" id="fee-doc-id" />
          <div class="row g-3">
            <div class="col-12">
              <label for="f-player" class="form-label">Player <span class="text-danger">*</span></label>
              <select id="f-player" class="form-select" required>
                <option value="">Select player…</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="f-amount" class="form-label">Amount (₹) <span class="text-danger">*</span></label>
              <input type="number" id="f-amount" class="form-control" placeholder="e.g. 2000" min="1" max="999999" required />
            </div>
            <div class="col-md-6">
              <label for="f-date" class="form-label">Payment Date <span class="text-danger">*</span></label>
              <input type="date" id="f-date" class="form-control" required />
            </div>
            <div class="col-md-6">
              <label for="f-status" class="form-label">Status <span class="text-danger">*</span></label>
              <select id="f-status" class="form-select" required>
                <option value="">Select status…</option>
                <option value="paid">Paid</option>
                <option value="pending">Pending</option>
                <option value="partial">Partial</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="f-method" class="form-label">Payment Method <span class="text-danger">*</span></label>
              <select id="f-method" class="form-select" required>
                <option value="">Select method…</option>
                <option value="cash">
                  💵 Cash
                </option>
                <option value="online">
                  🌐 Online
                </option>
              </select>
            </div>
            <div class="col-12">
              <label for="f-notes" class="form-label">Notes</label>
              <textarea id="f-notes" class="form-control" rows="2" placeholder="Optional notes about payment…" maxlength="200"></textarea>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn-primary-custom" id="save-fee-btn">
          <i class="bi bi-check-lg me-1"></i>Save Payment
        </button>
      </div>
    </div>
  </div>
</div>

<div id="toast-container" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script type="module">
  import { observeAuth }  from './js/firebase-db.js';
  import { initTheme, initSidebar, initLogout, toggleTheme } from './js/main.js';
  import { injectSidebar } from './js/sidebar.js';
  import { initFees }      from './js/fees.js';

  initTheme();
  injectSidebar('sidebar');

  observeAuth((user) => {
    const overlay = document.getElementById('auth-loading-overlay');
    const content = document.getElementById('page-content');
    if (!user) { window.location.replace('index.html'); return; }
    if (overlay) overlay.style.display = 'none';
    if (content) content.style.display = 'block';
    initSidebar();
    initLogout();
    document.getElementById('theme-toggle-btn')?.addEventListener('click', toggleTheme);
    initFees();
  });
</script>
</body>
</html>
