<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Cricket Academy — Coach Profile" />
  <title>Coach — Cricket Academy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="auth-loading-overlay" role="status">
  <div class="spinner-border"></div>
  <p>Loading…</p>
</div>

<div class="layout-wrapper">
  <aside id="sidebar" role="navigation" aria-label="Sidebar"></aside>
  <div id="sidebar-overlay"></div>

  <div class="main-content">
    <header class="top-navbar">
      <button id="sidebar-toggle" aria-label="Toggle sidebar"><i class="bi bi-list"></i></button>
      <span class="page-title"><i class="bi bi-person-badge-fill me-2"></i>Coach Profile</span>
      <div class="ms-auto d-flex align-items-center gap-2">
        <button class="icon-btn" id="theme-toggle-btn" aria-label="Toggle theme"><i class="bi bi-moon-stars-fill" id="theme-icon"></i></button>
        <a href="#" class="btn btn-sm btn-outline-danger ms-1" data-action="logout" style="font-size:0.8rem;"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
      </div>
    </header>

    <main class="page-content" id="page-content" style="display:none;">
      <div class="page-header">
        <div>
          <h2><i class="bi bi-person-badge-fill me-2 text-primary-custom"></i>Coach</h2>
          <p>Academy head coach information</p>
        </div>
        <button class="btn-primary-custom" id="edit-coach-btn" aria-label="Edit coach details">
          <i class="bi bi-pencil-square me-1"></i> Edit Details
        </button>
      </div>

      <!-- Coach Profile -->
      <div class="row justify-content-center">
        <div class="col-12 col-lg-8 col-xl-7">
          <div class="coach-profile-card animate-fade-in" id="coach-profile-area">
            <!-- Loading state -->
            <div id="coach-loading" style="padding:4rem;text-align:center;">
              <div class="spinner-border" style="color:var(--clr-primary);width:3rem;height:3rem;" role="status"></div>
              <p style="margin-top:1rem;color:var(--clr-text-muted);">Loading coach profile…</p>
            </div>
            <!-- Profile content (injected) -->
            <div id="coach-content" style="display:none;">
              <div class="coach-profile-header">
                <div class="coach-avatar-wrap">
                  <img id="coach-photo-img" src="assets/coach.png" alt="Coach Photo" onerror="this.src='https://placehold.co/120x120/0f4c5c/fff?text=Coach'" />
                </div>
                <div class="coach-name" id="coach-name-display">—</div>
                <div class="coach-title" id="coach-title-display">Head Coach</div>
              </div>
              <div class="coach-info-grid">
                <div class="coach-info-item">
                  <span class="coach-info-label"><i class="bi bi-briefcase me-1"></i>Experience</span>
                  <span class="coach-info-value" id="coach-exp-display">—</span>
                </div>
                <div class="coach-info-item">
                  <span class="coach-info-label"><i class="bi bi-award me-1"></i>Specialty</span>
                  <span class="coach-info-value" id="coach-specialty-display">—</span>
                </div>
                <div class="coach-info-item">
                  <span class="coach-info-label"><i class="bi bi-telephone me-1"></i>Contact</span>
                  <span class="coach-info-value" id="coach-contact-display">—</span>
                </div>
                <div class="coach-info-item">
                  <span class="coach-info-label"><i class="bi bi-envelope me-1"></i>Email</span>
                  <span class="coach-info-value" id="coach-email-display">—</span>
                </div>
                <div class="coach-info-item" style="grid-column:1/-1;">
                  <span class="coach-info-label"><i class="bi bi-trophy me-1"></i>Achievements</span>
                  <span class="coach-info-value" id="coach-achievements-display" style="white-space:pre-line;">—</span>
                </div>
              </div>
              <div style="padding:1rem 2rem 1.5rem;">
                <div class="coach-info-label mb-2"><i class="bi bi-file-text me-1"></i>Bio</div>
                <p id="coach-bio-display" style="font-size:0.9rem;color:var(--clr-text-secondary);line-height:1.7;">—</p>
              </div>
            </div>
            <!-- Empty state -->
            <div id="coach-empty" style="display:none;">
              <div class="empty-state">
                <i class="bi bi-person-badge"></i>
                <h5>No Coach Profile Yet</h5>
                <p>Click "Edit Details" to set up the coach profile.</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Edit Coach Modal -->
<div class="modal fade" id="coachModal" tabindex="-1" aria-labelledby="coachModalLabel" aria-modal="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="coachModalLabel"><i class="bi bi-pencil-square me-2"></i>Edit Coach Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="coach-form" novalidate>
          <div class="row g-3">
            <div class="col-md-6">
              <label for="c-name" class="form-label">Coach Name <span class="text-danger">*</span></label>
              <input type="text" id="c-name" class="form-control" placeholder="Full name" maxlength="80" required />
            </div>
            <div class="col-md-6">
              <label for="c-title" class="form-label">Title / Designation</label>
              <input type="text" id="c-title" class="form-control" placeholder="e.g. Head Coach" maxlength="60" />
            </div>
            <div class="col-md-6">
              <label for="c-exp" class="form-label">Experience <span class="text-danger">*</span></label>
              <input type="text" id="c-exp" class="form-control" placeholder="e.g. 15 years" maxlength="40" required />
            </div>
            <div class="col-md-6">
              <label for="c-specialty" class="form-label">Specialty <span class="text-danger">*</span></label>
              <input type="text" id="c-specialty" class="form-control" placeholder="e.g. Fast Bowling, Batting" maxlength="80" required />
            </div>
            <div class="col-md-6">
              <label for="c-contact" class="form-label">Contact Number <span class="text-danger">*</span></label>
              <input type="tel" id="c-contact" class="form-control" placeholder="10-digit number" maxlength="15" required />
            </div>
            <div class="col-md-6">
              <label for="c-email" class="form-label">Email</label>
              <input type="email" id="c-email" class="form-control" placeholder="coach@academy.com" maxlength="100" />
            </div>
            <div class="col-12">
              <label for="c-achievements" class="form-label">Achievements</label>
              <textarea id="c-achievements" class="form-control" rows="3" placeholder="Awards, international experience, notable achievements…" maxlength="500"></textarea>
            </div>
            <div class="col-12">
              <label for="c-bio" class="form-label">Bio</label>
              <textarea id="c-bio" class="form-control" rows="4" placeholder="A brief biography of the coach…" maxlength="1000"></textarea>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn-primary-custom" id="save-coach-btn">
          <i class="bi bi-check-lg me-1"></i>Save
        </button>
      </div>
    </div>
  </div>
</div>

<div id="toast-container" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
  import { observeAuth }   from './js/firebase-db.js';
  import { initTheme, initSidebar, initLogout, toggleTheme } from './js/main.js';
  import { injectSidebar } from './js/sidebar.js';
  import { initCoach }     from './js/coach.js';

  initTheme();
  injectSidebar('sidebar');

  observeAuth((user) => {
    const overlay = document.getElementById('auth-loading-overlay');
    const content = document.getElementById('page-content');
    if (!user) { window.location.replace('index.html'); return; }
    if (overlay) overlay.style.display = 'none';
    if (content) content.style.display = 'block';
    initSidebar();
    initLogout();
    document.getElementById('theme-toggle-btn')?.addEventListener('click', toggleTheme);
    initCoach();
  });
</script>
</body>
</html>
