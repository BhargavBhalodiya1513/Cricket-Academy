<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Cricket Academy Management System — Dashboard" />
  <title>Dashboard — Cricket Academy</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- Auth Loading Overlay -->
<div id="auth-loading-overlay" role="status">
  <div class="spinner-border"></div>
  <p>Loading dashboard…</p>
</div>

<div class="layout-wrapper">
  <!-- SIDEBAR -->
  <aside id="sidebar" role="navigation" aria-label="Sidebar"></aside>
  <div id="sidebar-overlay"></div>

  <!-- MAIN CONTENT -->
  <div class="main-content">

    <!-- TOP NAVBAR -->
    <header class="top-navbar">
      <button id="sidebar-toggle" aria-label="Toggle sidebar">
        <i class="bi bi-list"></i>
      </button>
      <span class="page-title"><i class="bi bi-speedometer2 me-2"></i>Dashboard</span>
      <div class="ms-auto d-flex align-items-center gap-2">
        <button class="icon-btn" id="theme-toggle-btn" aria-label="Toggle dark/light mode">
          <i class="bi bi-moon-stars-fill" id="theme-icon"></i>
        </button>
        <div class="navbar-admin-info">
          <div class="admin-avatar" aria-hidden="true">A</div>
          <span id="admin-email-display" class="d-none d-md-inline">Admin</span>
        </div>
        <a href="#" class="btn btn-sm btn-outline-danger ms-1" data-action="logout" style="font-size:0.8rem;">
          <i class="bi bi-box-arrow-right me-1"></i>Logout
        </a>
      </div>
    </header>

    <!-- PAGE CONTENT -->
    <main class="page-content" id="dashboard-content" style="display:none;">

      <!-- Page Header -->
      <div class="page-header">
        <div>
          <h2><i class="bi bi-speedometer2 me-2 text-primary-custom"></i>Overview</h2>
          <p id="dashboard-date" class="text-muted"></p>
        </div>
        <button class="btn-primary-custom" id="refresh-dashboard-btn" aria-label="Refresh dashboard">
          <i class="bi bi-arrow-clockwise"></i> Refresh
        </button>
      </div>

      <!-- Stat Cards -->
      <div class="row g-3 mb-4" id="stat-cards-row">
        <div class="col-6 col-lg-3">
          <div class="stat-card card-primary animate-fade-in">
            <div class="stat-icon"><i class="bi bi-people-fill"></i></div>
            <div class="stat-value" id="stat-players">—</div>
            <div class="stat-label">Total Players</div>
            <i class="bi bi-people stat-bg-icon" aria-hidden="true"></i>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-card card-success animate-fade-in">
            <div class="stat-icon"><i class="bi bi-layers-fill"></i></div>
            <div class="stat-value" id="stat-batches">—</div>
            <div class="stat-label">Total Batches</div>
            <i class="bi bi-layers stat-bg-icon" aria-hidden="true"></i>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-card card-accent animate-fade-in">
            <div class="stat-icon"><i class="bi bi-calendar-check-fill"></i></div>
            <div class="stat-value" id="stat-present">—</div>
            <div class="stat-label">Present Today</div>
            <i class="bi bi-calendar-check stat-bg-icon" aria-hidden="true"></i>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-card card-danger animate-fade-in">
            <div class="stat-icon"><i class="bi bi-cash-coin"></i></div>
            <div class="stat-value" id="stat-pending-fees">—</div>
            <div class="stat-label">Pending Fees</div>
            <i class="bi bi-cash stat-bg-icon" aria-hidden="true"></i>
          </div>
        </div>
      </div>

      <!-- Charts + Activity -->
      <div class="row g-3 mb-4">
        <!-- Attendance Chart -->
        <div class="col-lg-8">
          <div class="card-panel h-100">
            <div class="panel-header">
              <h5><i class="bi bi-bar-chart-fill text-primary-custom me-1"></i>Attendance Overview (Last 7 Days)</h5>
              <span id="chart-loading-indicator" style="font-size:0.8rem;color:var(--clr-text-muted);">Loading…</span>
            </div>
            <div class="panel-body">
              <div class="chart-container">
                <canvas id="attendance-chart" aria-label="Attendance chart for last 7 days" role="img"></canvas>
              </div>
            </div>
          </div>
        </div>

        <!-- Recent Activity -->
        <div class="col-lg-4">
          <div class="card-panel h-100">
            <div class="panel-header">
              <h5><i class="bi bi-activity text-primary-custom me-1"></i>Recent Activity</h5>
            </div>
            <div class="panel-body p-0" style="padding:0!important;">
              <div id="activity-feed" style="padding:0.5rem 1rem;">
                <div class="table-loading">
                  <div class="spinner-border spinner-border-sm me-2"></div> Loading…
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Players & Fees quick tables -->
      <div class="row g-3">
        <!-- Recent Players -->
        <div class="col-lg-6">
          <div class="card-panel">
            <div class="panel-header">
              <h5><i class="bi bi-person-lines-fill text-primary-custom me-1"></i>Recent Players</h5>
              <a href="players.html" class="btn btn-sm" style="font-size:0.78rem;color:var(--clr-primary);border:1px solid var(--clr-primary);border-radius:6px;padding:0.3rem 0.75rem;">View All</a>
            </div>
            <div class="table-wrapper">
              <table class="data-table" id="recent-players-table">
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="recent-players-body">
                  <tr><td colspan="3" class="table-loading"><div class="spinner-border spinner-border-sm"></div></td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Pending Fees -->
        <div class="col-lg-6">
          <div class="card-panel">
            <div class="panel-header">
              <h5><i class="bi bi-exclamation-circle text-primary-custom me-1"></i>Pending Fee Players</h5>
              <a href="fees.html" class="btn btn-sm" style="font-size:0.78rem;color:var(--clr-primary);border:1px solid var(--clr-primary);border-radius:6px;padding:0.3rem 0.75rem;">View All</a>
            </div>
            <div class="table-wrapper">
              <table class="data-table" id="pending-fees-table">
                <thead>
                  <tr>
                    <th>Player</th>
                    <th>Amount</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="pending-fees-body">
                  <tr><td colspan="3" class="table-loading"><div class="spinner-border spinner-border-sm"></div></td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </main><!-- /page-content -->
  </div><!-- /main-content -->
</div><!-- /layout-wrapper -->

<!-- Toast Container -->
<div id="toast-container" aria-live="polite"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

<script type="module">
  import { observeAuth }      from './js/firebase-db.js';
  import { initTheme, initSidebar, initLogout, showToast } from './js/main.js';
  import { injectSidebar }    from './js/sidebar.js';
  import { loadDashboard }    from './js/dashboard.js';

  initTheme();
  injectSidebar('sidebar');

  observeAuth((user) => {
    const overlay  = document.getElementById('auth-loading-overlay');
    const content  = document.getElementById('dashboard-content');
    if (!user) {
      window.location.replace('index.html');
      return;
    }
    if (overlay) overlay.style.display = 'none';
    if (content) content.style.display = 'block';

    // Update admin display
    const emailEl = document.getElementById('admin-email-display');
    if (emailEl) emailEl.textContent = user.email || 'Admin';

    // Set today's date
    const dateEl = document.getElementById('dashboard-date');
    if (dateEl) dateEl.textContent = new Date().toLocaleDateString('en-IN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    initSidebar();
    initLogout();

    // Theme toggle
    document.getElementById('theme-toggle-btn')?.addEventListener('click', () => {
      const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
      try { localStorage.setItem('cams_theme', t); } catch(_) {}
      const icon = document.getElementById('theme-icon');
      if (icon) icon.className = t === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';
    });

    loadDashboard();

    document.getElementById('refresh-dashboard-btn')?.addEventListener('click', () => {
      showToast('Dashboard refreshed!', 'info', 2000);
      loadDashboard();
    });
  });
</script>
</body>
</html>
