<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Cricket Academy — Attendance Management" />
  <title>Attendance — Cricket Academy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="auth-loading-overlay" role="status">
  <div class="spinner-border"></div>
  <p>Loading…</p>
</div>

<div class="layout-wrapper">
  <aside id="sidebar" role="navigation" aria-label="Sidebar"></aside>
  <div id="sidebar-overlay"></div>

  <div class="main-content">
    <header class="top-navbar">
      <button id="sidebar-toggle" aria-label="Toggle sidebar"><i class="bi bi-list"></i></button>
      <span class="page-title"><i class="bi bi-calendar-check-fill me-2"></i>Attendance</span>
      <div class="ms-auto d-flex align-items-center gap-2">
        <button class="icon-btn" id="theme-toggle-btn" aria-label="Toggle theme"><i class="bi bi-moon-stars-fill" id="theme-icon"></i></button>
        <a href="#" class="btn btn-sm btn-outline-danger ms-1" data-action="logout" style="font-size:0.8rem;"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
      </div>
    </header>

    <main class="page-content" id="page-content" style="display:none;">
      <div class="page-header">
        <div>
          <h2><i class="bi bi-calendar-check-fill me-2 text-primary-custom"></i>Attendance</h2>
          <p>Mark and track player attendance</p>
        </div>
        <div class="d-flex gap-2 flex-wrap">
          <button class="btn btn-sm btn-outline-success" id="export-excel-att" title="Export to Excel">
            <i class="bi bi-file-earmark-excel me-1"></i>Excel
          </button>
          <button class="btn-primary-custom" id="save-attendance-btn" disabled>
            <i class="bi bi-save me-1"></i> Save Attendance
          </button>
        </div>
      </div>

      <!-- Stats Row -->
      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
          <div class="stat-card card-primary">
            <div class="stat-icon"><i class="bi bi-people-fill"></i></div>
            <div class="stat-value" id="att-stat-total">—</div>
            <div class="stat-label">Total Players</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card card-success">
            <div class="stat-icon"><i class="bi bi-check-circle-fill"></i></div>
            <div class="stat-value" id="att-stat-present">0</div>
            <div class="stat-label">Present</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card card-danger">
            <div class="stat-icon"><i class="bi bi-x-circle-fill"></i></div>
            <div class="stat-value" id="att-stat-absent">0</div>
            <div class="stat-label">Absent</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card card-accent">
            <div class="stat-icon"><i class="bi bi-slash-circle-fill"></i></div>
            <div class="stat-value" id="att-stat-excused">0</div>
            <div class="stat-label">Excused</div>
          </div>
        </div>
      </div>

      <!-- Date Selector + Tabs -->
      <div class="row g-3">
        <!-- Mark Attendance -->
        <div class="col-12 col-lg-7">
          <div class="card-panel">
            <div class="panel-header">
              <h5><i class="bi bi-pencil-fill text-primary-custom me-1"></i>Mark Attendance</h5>
              <div class="d-flex align-items-center gap-2">
                <label for="att-date" class="form-label mb-0" style="font-size:0.82rem;white-space:nowrap;">Date:</label>
                <input type="date" id="att-date" class="form-control form-control-sm" style="width:auto;" aria-label="Select attendance date" />
              </div>
            </div>
            <div class="panel-body p-0">
              <div id="attendance-mark-list">
                <div class="table-loading">
                  <div class="spinner-border spinner-border-sm me-2"></div> Loading players…
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Attendance History -->
        <div class="col-12 col-lg-5">
          <div class="card-panel">
            <div class="panel-header">
              <h5><i class="bi bi-clock-history text-primary-custom me-1"></i>Attendance History</h5>
              <div class="d-flex gap-1">
                <input type="date" id="history-date" class="form-control form-control-sm" style="width:auto;" aria-label="Filter history by date" />
              </div>
            </div>
            <div class="table-wrapper">
              <table class="data-table" id="attendance-history-table">
                <thead>
                  <tr>
                    <th>Player</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Del</th>
                  </tr>
                </thead>
                <tbody id="attendance-history-tbody">
                  <tr><td colspan="4" class="table-loading"><div class="spinner-border spinner-border-sm"></div></td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="toast-container" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script type="module">
  import { observeAuth }     from './js/firebase-db.js';
  import { initTheme, initSidebar, initLogout, toggleTheme } from './js/main.js';
  import { injectSidebar }   from './js/sidebar.js';
  import { initAttendance }  from './js/attendance.js';

  initTheme();
  injectSidebar('sidebar');

  observeAuth((user) => {
    const overlay = document.getElementById('auth-loading-overlay');
    const content = document.getElementById('page-content');
    if (!user) { window.location.replace('index.html'); return; }
    if (overlay) overlay.style.display = 'none';
    if (content) content.style.display = 'block';
    initSidebar();
    initLogout();
    document.getElementById('theme-toggle-btn')?.addEventListener('click', toggleTheme);
    initAttendance();
  });
</script>
</body>
</html>
