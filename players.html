<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Cricket Academy — Player Management" />
  <title>Players — Cricket Academy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="auth-loading-overlay" role="status">
  <div class="spinner-border"></div>
  <p>Loading…</p>
</div>

<div class="layout-wrapper">
  <aside id="sidebar" role="navigation" aria-label="Sidebar"></aside>
  <div id="sidebar-overlay"></div>

  <div class="main-content">
    <!-- TOP NAVBAR -->
    <header class="top-navbar">
      <button id="sidebar-toggle" aria-label="Toggle sidebar"><i class="bi bi-list"></i></button>
      <span class="page-title"><i class="bi bi-people-fill me-2"></i>Player Management</span>
      <div class="ms-auto d-flex align-items-center gap-2">
        <button class="icon-btn" id="theme-toggle-btn" aria-label="Toggle theme"><i class="bi bi-moon-stars-fill" id="theme-icon"></i></button>
        <a href="#" class="btn btn-sm btn-outline-danger ms-1" data-action="logout" style="font-size:0.8rem;"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
      </div>
    </header>

    <main class="page-content" id="page-content" style="display:none;">
      <!-- Header -->
      <div class="page-header">
        <div>
          <h2><i class="bi bi-people-fill me-2 text-primary-custom"></i>Players</h2>
          <p>Manage all academy players</p>
        </div>
        <div class="d-flex gap-2 flex-wrap">
          <button class="btn btn-sm btn-outline-success" id="export-excel-btn" title="Export to Excel">
            <i class="bi bi-file-earmark-excel me-1"></i>Excel
          </button>
          <button class="btn btn-sm btn-outline-danger" id="export-pdf-btn" title="Export to PDF">
            <i class="bi bi-file-earmark-pdf me-1"></i>PDF
          </button>
          <button class="btn-primary-custom" id="add-player-btn" aria-label="Add new player">
            <i class="bi bi-person-plus-fill"></i> Add Player
          </button>
        </div>
      </div>

      <!-- Filters & Search -->
      <div class="card-panel mb-3">
        <div class="panel-body py-3">
          <div class="row g-2 align-items-center">
            <div class="col-12 col-md-5">
              <div class="search-bar">
                <i class="bi bi-search"></i>
                <input type="search" id="player-search" class="form-control" placeholder="Search by name, mobile…" aria-label="Search players" />
              </div>
            </div>
            <div class="col-6 col-md-3">
              <select id="filter-type" class="form-select form-select-sm" aria-label="Filter by playing type">
                <option value="">All Types</option>
                <option value="Batsman">Batsman</option>
                <option value="Bowler">Bowler</option>
                <option value="All-rounder">All-rounder</option>
              </select>
            </div>
            <div class="col-6 col-md-3">
              <select id="filter-fees" class="form-select form-select-sm" aria-label="Filter by fee status">
                <option value="">All Fee Status</option>
                <option value="paid">Paid</option>
                <option value="pending">Pending</option>
                <option value="partial">Partial</option>
              </select>
            </div>
            <div class="col-md-1 text-end">
              <button class="btn btn-sm btn-outline-secondary" id="clear-filters-btn" title="Clear filters">
                <i class="bi bi-x-circle"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Players Table -->
      <div class="card-panel">
        <div class="panel-header">
          <h5><i class="bi bi-table me-1 text-primary-custom"></i>All Players</h5>
          <span id="player-count-label" style="font-size:0.8rem;color:var(--clr-text-muted);"></span>
        </div>
        <div class="table-wrapper">
          <table class="data-table" id="players-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Age</th>
                <th>Mobile</th>
                <th>Type</th>
                <th>Batch</th>
                <th>Joining Date</th>
                <th>Fee Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="players-tbody">
              <tr>
                <td colspan="9">
                  <div class="table-loading">
                    <div class="spinner-border spinner-border-sm me-2"></div> Loading players…
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Add/Edit Player Modal -->
<div class="modal fade" id="playerModal" tabindex="-1" aria-labelledby="playerModalLabel" aria-modal="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="playerModalLabel"><i class="bi bi-person-plus-fill me-2"></i>Add Player</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="player-form" novalidate>
          <input type="hidden" id="player-doc-id" />
          <div class="row g-3">
            <div class="col-md-6">
              <label for="p-name" class="form-label">Full Name <span class="text-danger">*</span></label>
              <input type="text" id="p-name" class="form-control" placeholder="e.g. Rahul Sharma" maxlength="80" required />
            </div>
            <div class="col-md-3">
              <label for="p-age" class="form-label">Age <span class="text-danger">*</span></label>
              <input type="number" id="p-age" class="form-control" placeholder="e.g. 18" min="5" max="99" required />
            </div>
            <div class="col-md-3">
              <label for="p-mobile" class="form-label">Mobile <span class="text-danger">*</span></label>
              <input type="tel" id="p-mobile" class="form-control" placeholder="10-digit number" maxlength="15" required />
            </div>
            <div class="col-12">
              <label for="p-address" class="form-label">Address</label>
              <textarea id="p-address" class="form-control" rows="2" placeholder="Enter full address" maxlength="200"></textarea>
            </div>
            <div class="col-md-4">
              <label for="p-joining-date" class="form-label">Joining Date <span class="text-danger">*</span></label>
              <input type="date" id="p-joining-date" class="form-control" required />
            </div>
            <div class="col-md-4">
              <label for="p-type" class="form-label">Playing Type <span class="text-danger">*</span></label>
              <select id="p-type" class="form-select" required>
                <option value="">Select type…</option>
                <option value="Batsman">Batsman</option>
                <option value="Bowler">Bowler</option>
                <option value="All-rounder">All-rounder</option>
              </select>
            </div>
            <div class="col-md-4">
              <label for="p-fees-status" class="form-label">Fee Status <span class="text-danger">*</span></label>
              <select id="p-fees-status" class="form-select" required>
                <option value="">Select status…</option>
                <option value="paid">Paid</option>
                <option value="pending">Pending</option>
                <option value="partial">Partial</option>
              </select>
            </div>
            <div class="col-md-4 initial-fee-field" style="display:none;">
              <label for="p-fee-amount" class="form-label">Initial Payment (₹) <span class="text-danger">*</span></label>
              <input type="number" id="p-fee-amount" class="form-control" placeholder="e.g. 2000" min="1" />
            </div>
            <div class="col-md-4 initial-fee-field" style="display:none;">
              <label for="p-fee-method" class="form-label">Payment Method <span class="text-danger">*</span></label>
              <select id="p-fee-method" class="form-select">
                <option value="">Select method…</option>
                <option value="cash">💵 Cash</option>
                <option value="online">🌐 Online</option>
              </select>
            </div>
            <div class="col-12">
              <label for="p-batch" class="form-label">Assign Batch</label>
              <select id="p-batch" class="form-select">
                <option value="">No Batch</option>
              </select>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn-primary-custom" id="save-player-btn">
          <i class="bi bi-check-lg me-1"></i>Save Player
        </button>
      </div>
    </div>
  </div>
</div>

<!-- View Player Modal -->
<div class="modal fade" id="viewPlayerModal" tabindex="-1" aria-labelledby="viewPlayerModalLabel" aria-modal="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="viewPlayerModalLabel"><i class="bi bi-person-circle me-2"></i>Player Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="view-player-body">
        <!-- Injected dynamically -->
      </div>
      <div class="modal-footer"><button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button></div>
    </div>
  </div>
</div>

<div id="toast-container" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- SheetJS for Excel export -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<!-- jsPDF + AutoTable for PDF export -->
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>

<script type="module">
  import { observeAuth }    from './js/firebase-db.js';
  import { initTheme, initSidebar, initLogout, showToast, toggleTheme } from './js/main.js';
  import { injectSidebar } from './js/sidebar.js';
  import { initPlayers }   from './js/players.js';

  initTheme();
  injectSidebar('sidebar');

  observeAuth((user) => {
    const overlay = document.getElementById('auth-loading-overlay');
    const content = document.getElementById('page-content');
    if (!user) { window.location.replace('index.html'); return; }
    if (overlay) overlay.style.display = 'none';
    if (content) content.style.display = 'block';
    initSidebar();
    initLogout();
    document.getElementById('theme-toggle-btn')?.addEventListener('click', toggleTheme);
    initPlayers();
  });
</script>
</body>
</html>
