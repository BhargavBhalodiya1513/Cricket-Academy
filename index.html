<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Cricket Academy Management System — Admin Login" />
  <title>Login — Cricket Academy Management System</title>

  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Auth loading overlay (shown until Firebase resolves auth state) -->
  <div id="auth-loading-overlay" role="status" aria-live="polite">
    <div class="spinner-border" aria-hidden="true"></div>
    <p>Checking session…</p>
  </div>

  <!-- Login Page -->
  <main class="login-page" id="login-page" style="display:none;">
    <!-- Background -->
    <div class="login-bg" aria-hidden="true"></div>
    <div class="login-bg-overlay" aria-hidden="true"></div>

    <!-- Login Card -->
    <div class="login-card animate-slide-up" role="main">
      <img src="assets/logo.png" alt="Cricket Academy Logo" class="login-logo" onerror="this.src='https://placehold.co/72x72/0f4c5c/fff?text=CA'" />
      <h3>Cricket Academy</h3>
      <p>Management System — Admin Portal</p>

      <!-- Login Form -->
      <form id="login-form" novalidate autocomplete="on">
        <div class="mb-3">
          <label for="login-email" class="form-label">Email Address</label>
          <div class="input-group">
            <span class="input-group-text" style="background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2);color:rgba(255,255,255,0.6)">
              <i class="bi bi-envelope"></i>
            </span>
            <input
              type="email"
              id="login-email"
              name="email"
              class="form-control"
              placeholder="admin@academy.com"
              autocomplete="email"
              required
              aria-required="true"
            />
          </div>
          <div class="invalid-feedback" id="email-error" style="color:#f0a0a0;font-size:0.8rem;margin-top:0.25rem;display:none;"></div>
        </div>

        <div class="mb-3">
          <label for="login-password" class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text" style="background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2);color:rgba(255,255,255,0.6)">
              <i class="bi bi-lock"></i>
            </span>
            <input
              type="password"
              id="login-password"
              name="password"
              class="form-control"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
              aria-required="true"
            />
            <button type="button" class="input-group-text" id="toggle-password" aria-label="Show/hide password"
              style="background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2);color:rgba(255,255,255,0.6);cursor:pointer;">
              <i class="bi bi-eye" id="pw-eye-icon"></i>
            </button>
          </div>
          <div class="invalid-feedback" id="pw-error" style="color:#f0a0a0;font-size:0.8rem;margin-top:0.25rem;display:none;"></div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember-me" />
            <label class="form-check-label" for="remember-me" style="color:rgba(255,255,255,0.65);font-size:0.85rem;">
              Remember me
            </label>
          </div>
          <a href="#" id="forgot-password-link" class="text-decoration-none" style="color:rgba(255,255,255,0.55);font-size:0.8rem;">
            Forgot Password?
          </a>
        </div>

        <div id="login-error-msg" class="alert alert-danger py-2 px-3" style="display:none;font-size:0.85rem;border-radius:8px;" role="alert">
          <i class="bi bi-exclamation-circle me-2"></i><span id="login-error-text"></span>
        </div>

        <button type="submit" class="login-btn" id="login-btn">
          <i class="bi bi-shield-lock-fill me-2"></i>Login as Admin
        </button>
      </form>

      <div class="login-footer-links mt-3">
        <span style="color:rgba(255,255,255,0.35);font-size:0.75rem;">© 2025 Cricket Academy</span>
      </div>
    </div>
  </main>

  <!-- Forgot Password Modal -->
  <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-labelledby="forgotPasswordModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="forgotPasswordModalLabel">
            <i class="bi bi-envelope-arrow-up me-2"></i>Reset Password
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p style="font-size:0.875rem;color:var(--clr-text-secondary)">
            Enter your registered email address. We will send you a link to reset your password.
          </p>
          <form id="forgot-form" novalidate>
            <div class="mb-3">
              <label for="forgot-email" class="form-label">Email Address</label>
              <input type="email" id="forgot-email" class="form-control" placeholder="admin@academy.com" autocomplete="email" required />
              <div id="forgot-email-error" class="text-danger mt-1" style="font-size:0.8rem;display:none;"></div>
            </div>
          </form>
          <div id="forgot-success-msg" class="alert alert-success py-2" style="display:none;font-size:0.85rem;">
            <i class="bi bi-check-circle me-2"></i>Reset link sent! Check your inbox.
          </div>
          <div id="forgot-error-msg" class="alert alert-danger py-2" style="display:none;font-size:0.85rem;"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-sm" id="send-reset-btn"
            style="background:var(--clr-primary);color:white;border:none;padding:0.45rem 1.2rem;border-radius:6px;">
            <i class="bi bi-send me-1"></i>Send Reset Link
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Firebase Auth Guard (redirects to dashboard if already logged in) -->
  <script type="module">
    import { observeAuth, loginAdmin, forgotPassword } from './js/firebase-db.js';
    import { showToast, setButtonLoading, initTheme } from './js/main.js';

    // Apply saved theme immediately
    initTheme();

    const loginPage    = document.getElementById('login-page');
    const authOverlay  = document.getElementById('auth-loading-overlay');

    // ─── AUTH STATE CHECK ───────────────────────────────────────────────────────
    observeAuth((user) => {
      if (user) {
        window.location.replace('dashboard.html');
      } else {
        authOverlay.style.display = 'none';
        loginPage.style.display = 'flex';
      }
    });

    // ─── SHOW/HIDE PASSWORD ─────────────────────────────────────────────────────
    const toggleBtn = document.getElementById('toggle-password');
    const pwInput   = document.getElementById('login-password');
    const pwEyeIcon = document.getElementById('pw-eye-icon');

    toggleBtn?.addEventListener('click', () => {
      const isText = pwInput.type === 'text';
      pwInput.type = isText ? 'password' : 'text';
      pwEyeIcon.className = isText ? 'bi bi-eye' : 'bi bi-eye-slash';
    });

    // ─── LOGIN FORM SUBMISSION ──────────────────────────────────────────────────
    const loginForm = document.getElementById('login-form');
    const loginBtn  = document.getElementById('login-btn');
    const errMsg    = document.getElementById('login-error-msg');
    const errText   = document.getElementById('login-error-text');

    function showFormError(msg) {
      if (errMsg && errText) { errText.textContent = msg; errMsg.style.display = 'block'; }
    }
    function hideFormError() {
      if (errMsg) errMsg.style.display = 'none';
    }

    loginForm?.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideFormError();

      const email       = (document.getElementById('login-email')?.value || '').trim();
      const password    = document.getElementById('login-password')?.value || '';
      const rememberMe  = document.getElementById('remember-me')?.checked || false;

      // Basic client-side validation
      let valid = true;
      if (!email) {
        showFieldError('email-error', 'Email address is required.'); valid = false;
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showFieldError('email-error', 'Please enter a valid email address.'); valid = false;
      } else {
        hideFieldError('email-error');
      }

      if (!password) {
        showFieldError('pw-error', 'Password is required.'); valid = false;
      } else if (password.length < 6) {
        showFieldError('pw-error', 'Password must be at least 6 characters.'); valid = false;
      } else {
        hideFieldError('pw-error');
      }

      if (!valid) return;

      setButtonLoading(loginBtn, true);

      const { user, error } = await loginAdmin(email, password, rememberMe);

      if (error) {
        showFormError(error);
        setButtonLoading(loginBtn, false);
      } else if (user) {
        window.location.replace('dashboard.html');
      }
    });

    function showFieldError(id, msg) {
      const el = document.getElementById(id);
      if (el) { el.textContent = msg; el.style.display = 'block'; }
    }
    function hideFieldError(id) {
      const el = document.getElementById(id);
      if (el) el.style.display = 'none';
    }

    // ─── FORGOT PASSWORD ────────────────────────────────────────────────────────
    const forgotLink  = document.getElementById('forgot-password-link');
    const forgotModal = new bootstrap.Modal(document.getElementById('forgotPasswordModal'));

    forgotLink?.addEventListener('click', (e) => { e.preventDefault(); forgotModal.show(); });

    const sendResetBtn    = document.getElementById('send-reset-btn');
    const forgotEmailEl   = document.getElementById('forgot-email');
    const forgotSuccessEl = document.getElementById('forgot-success-msg');
    const forgotErrorEl   = document.getElementById('forgot-error-msg');

    // Reset forgot modal state when opened
    document.getElementById('forgotPasswordModal')?.addEventListener('show.bs.modal', () => {
      if (forgotEmailEl) forgotEmailEl.value = '';
      if (forgotSuccessEl) forgotSuccessEl.style.display = 'none';
      if (forgotErrorEl)   forgotErrorEl.style.display = 'none';
    });

    sendResetBtn?.addEventListener('click', async () => {
      const email = (forgotEmailEl?.value || '').trim();
      if (forgotSuccessEl) forgotSuccessEl.style.display = 'none';
      if (forgotErrorEl)   forgotErrorEl.style.display = 'none';

      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        const errEl = document.getElementById('forgot-email-error');
        if (errEl) { errEl.textContent = 'Enter a valid email.'; errEl.style.display = 'block'; }
        return;
      }

      setButtonLoading(sendResetBtn, true);
      const { error } = await forgotPassword(email);
      setButtonLoading(sendResetBtn, false);

      if (error) {
        if (forgotErrorEl) { forgotErrorEl.textContent = error; forgotErrorEl.style.display = 'block'; }
      } else {
        if (forgotSuccessEl) forgotSuccessEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
